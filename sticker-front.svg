<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <!-- Lighter, vibrant Crimson/Red matching pouch lighting -->
    <linearGradient id="lightPouchRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94221b"/>
      <stop offset="40%" stop-color="#ba352d"/>
      <stop offset="70%" stop-color="#aa2c24"/>
      <stop offset="100%" stop-color="#8a1c16"/>
    </linearGradient>

    <filter id="pouchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Playfair+Display:ital,wght@0,700;1,600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
    
    /* ONLY NUTS N CUTS BY PAKEEZA IN CRISP WHITE */
    .brand-title-white {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: 4px;
    }
    .brand-amp-white {
      font-family: 'Great Vibes', cursive;
      font-size: 88px;
      fill: #ffffff;
    }
    .brand-by-white {
      font-family: 'Great Vibes', cursive;
      font-size: 46px;
      fill: #ffffff;
    }
  </style>

  <!-- Lighter Red Sticker Background -->
  <rect x="6" y="6" width="588" height="188" rx="16" fill="url(#lightPouchRed)" filter="url(#pouchShadow)"/>

  <!-- Clean Subtle White Inner Border -->
  <rect x="14" y="14" width="572" height="172" rx="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.95"/>
  <rect x="20" y="20" width="560" height="160" rx="9" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="5,3" opacity="0.45"/>

  <!-- CENTERED: SIRF "NUTS N CUTS by Pakeeza" IN CRISP WHITE -->
  <g transform="translate(300, 92)" text-anchor="middle">
    <!-- NUTS N CUTS -->
    <text x="0" y="0">
      <tspan class="brand-title-white" dx="-10">NUTS </tspan>
      <tspan class="brand-amp-white" dx="-6" dy="12">N</tspan>
      <tspan class="brand-title-white" dx="-6" dy="-12"> CUTS</tspan>
    </text>

    <!-- by Pakeeza -->
    <text x="50" y="52" class="brand-by-white">by Pakeeza</text>
  </g>
</svg>
