    <!-- White Card Mount -->
    <rect x="0" y="0" width="156" height="248" rx="10" fill="#ffffff" stroke="#9e241c" stroke-width="1.2" filter="url(#stickerShadow)"/>

    <!-- QR Top Badge -->
    <rect x="14" y="12" width="128" height="22" rx="999" fill="#fdf0f0"/>
    <text x="78" y="27" class="qr-banner-red" text-anchor="middle">Scan to Order</text>

