<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
  <defs>
    <!-- Paper tint matching the packaging pouch off-white paper texture -->
    <linearGradient id="pouchPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fdfcfb"/>
      <stop offset="100%" stop-color="#f8f6f0"/>
    </linearGradient>

    <filter id="stickerShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Playfair+Display:ital,wght@0,700;1,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
    
    /* LIGHTER CRIMSON RED BRAND TITLE */
    .brand-red { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 26px; fill: #9e241c; letter-spacing: 2px; }
    .brand-amp-red { font-family: 'Great Vibes', cursive; font-size: 40px; fill: #9e241c; }
    .brand-by-red { font-family: 'Great Vibes', cursive; font-size: 24px; fill: #9e241c; }
    
    .dark-header { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 11px; font-weight: 800; fill: #1c1815; text-transform: uppercase; letter-spacing: 1px; }
    .dark-val { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 700; fill: #111111; }
    .dark-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #555555; }

    .note-head-red { font-family: 'Playfair Display', Georgia, serif; font-size: 15px; font-weight: 700; fill: #9e241c; }
    .note-dark-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #1a1a1a; line-height: 1.5; }

    .qr-banner-red { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 10px; font-weight: 800; fill: #9e241c; letter-spacing: 1px; text-transform: uppercase; }
  </style>

  <!-- Pouch Matching Sticker Card Background -->
  <rect x="6" y="6" width="668" height="388" rx="14" fill="url(#pouchPaper)" filter="url(#stickerShadow)"/>

  <!-- Border Lines: Lighter Red Tone -->
  <rect x="14" y="14" width="652" height="372" rx="10" fill="none" stroke="#9e241c" stroke-width="2"/>
  <rect x="19" y="19" width="642" height="362" rx="7" fill="none" stroke="#222222" stroke-width="0.8" stroke-dasharray="4,2" opacity="0.35"/>

  <!-- TOP BRAND HEADER -->
  <g transform="translate(340, 48)" text-anchor="middle">
    <text x="0" y="0">
      <tspan class="brand-red">NUTS </tspan>
      <tspan class="brand-amp-red" dx="-4" dy="3">N</tspan>
      <tspan class="brand-red" dx="-4" dy="-3"> CUTS </tspan>
      <tspan class="brand-by-red">by Pakeeza</tspan>
    </text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#332c28" letter-spacing="2" text-transform: uppercase">
      Dry Fruits · Kitchen Spices · Premium Dates
    </text>
  </g>

  <!-- Header Separation Line -->
  <line x1="36" y1="84" x2="644" y2="84" stroke="#9e241c" stroke-width="1.2" opacity="0.7"/>
  <circle cx="340" cy="84" r="3" fill="#9e241c"/>

  <!-- LEFT COLUMN: Contact & Thank You Note -->
  <g transform="translate(36, 110)">

    <!-- Official Website Row -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-12" width="28" height="28" rx="6" fill="#fdf0f0"/>
      <!-- Globe Icon in Red -->
      <path d="M 14,-6 A 8,8 0 1,0 14,10 A 8,8 0 1,0 14,-6 Z M 6,2 L 22,2 M 14,-6 C 11,-2 11,6 14,10 C 17,6 17,-2 14,-6 Z" fill="none" stroke="#9e241c" stroke-width="1.5"/>
      <text x="36" y="0" class="dark-header" fill="#9e241c">Official Online Store</text>
      <text x="36" y="18" class="dark-val">https://nutsncuts-pakeeza.netlify.app/</text>
    </g>

    <!-- WhatsApp Row (Green icon) -->
    <g transform="translate(0, 52)">
      <rect x="0" y="-12" width="28" height="28" rx="6" fill="#eaf6ee"/>
      <!-- WhatsApp Icon -->
      <path d="M 14,-6 A 8,8 0 0,0 7,6 L 6,10 L 10,9 A 8,8 0 1,0 14,-6 Z" fill="none" stroke="#1d824c" stroke-width="1.5"/>
      <circle cx="13" cy="2" r="1.5" fill="#1d824c"/>
      <text x="36" y="0" class="dark-header" fill="#1d824c">WhatsApp &amp; Direct Orders</text>
      <text x="36" y="18" class="dark-val">+92 333 3415977 <tspan class="dark-sub">(Call / Message)</tspan></text>
    </g>

    <!-- Thank You Note Box (Clean White Box with Red Left Accent) -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="414" height="92" rx="8" fill="#ffffff" stroke="#e3ded9" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="92" rx="2" fill="#9e241c"/>
      
      <text x="16" y="24" class="note-head-red">Thank You for Choosing Us! 🤲</text>
      <text x="16" y="48" class="note-dark-body">
        <tspan x="16" dy="0">We handpick and seal every spice, nut, date &amp; seed</tspan>
        <tspan x="16" dy="18">with utmost hygiene for your family’s health and pure taste.</tspan>
        <tspan x="16" dy="18" font-weight="700" fill="#9e241c">Scan the QR code to reorder anytime!</tspan>
      </text>
    </g>

  </g>

  <!-- Vertical Divider Line -->
  <line x1="472" y1="102" x2="472" y2="355" stroke="#d5cecb" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- RIGHT COLUMN: High-Contrast QR Code Card with 4-Module Quiet Zone -->
