<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuts N Cuts by Pakeeza — Scan to Shop Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14100e;
    --surface: #1e1815;
    --gold: #c29b61;
    --gold-bright: #dbb882;
    --copper: #d86534;
    --ivory: #f4ede2;
    --muted: #b3a594;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0a09;
    color: var(--ivory);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .qr-card {
    background: linear-gradient(145deg, #1f1814, #15100e);
    border: 2px solid rgba(194,155,97,.35);
    border-radius: 28px;
    width: min(440px, 100%);
    padding: 40px 32px 34px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(194,155,97,.15);
    position: relative;
    overflow: hidden;
  }
  .qr-card::before {
    content: "";
    position: absolute;
    top: -50px; left: 50%; transform: translateX(-50%);
    width: 280px; height: 180px;
    background: radial-gradient(circle, rgba(216,101,52,.18), transparent 70%);
    pointer-events: none;
  }

  /* Brand Lockup */
  .brand-seal {
    width: 48px; height: 48px; margin: 0 auto 14px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    background: radial-gradient(circle, rgba(216,101,52,.25), rgba(20,16,14,.9) 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Cinzel", Georgia, serif;
    font-size: 13px; font-weight: 700;
    color: var(--gold-bright);
    letter-spacing: .08em;
  }
  .brand-title {
    display: flex; align-items: baseline; justify-content: center;
    gap: 4px; line-height: 1;
  }
  .brand-title span {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 26px; font-weight: 700;
    letter-spacing: .08em;
    color: var(--gold-bright);
  }
  .brand-title em {
    font-family: "Great Vibes", cursive;
    font-size: 38px; color: var(--copper);
    font-weight: 400; position: relative; top: 3px;
  }
  .brand-by {
    font-family: "Great Vibes", cursive;
    font-size: 16px; color: var(--ivory);
    margin-top: 2px; margin-bottom: 18px;
  }

  .tagline {
    font-size: 13px; font-weight: 600;
    color: var(--muted);
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }

  /* QR Box */
  .qr-frame {
    background: #ffffff;
    padding: 16px;
    border-radius: 20px;
    display: inline-block;
    box-shadow: 0 12px 30px rgba(0,0,0,.5);
    margin: 0 auto 20px;
  }
  .qr-frame img, .qr-frame svg {
    display: block;
    width: 220px; height: 220px;
  }

  .scan-prompt {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 20px; font-weight: 600;
    color: var(--ivory);
    margin-bottom: 6px;
  }
  .url-pill {
    display: inline-block;
    background: rgba(194,155,97,.12);
    border: 1px solid rgba(194,155,97,.3);
    color: var(--gold-bright);
    font-size: 12.5px; font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    text-decoration: none;
    margin-bottom: 20px;
    word-break: break-all;
  }

  .card-footer {
    border-top: 1px solid rgba(194,155,97,.15);
    padding-top: 18px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .card-footer strong {
    color: var(--ivory);
    display: block;
    margin-bottom: 2px;
    font-size: 12.5px;
  }

  /* Actions Bar */
  .actions {
    margin-top: 24px;
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  }
  .btn {
    border: 0;
    padding: 10px 20px;
    border-radius: 999px;
    font-weight: 700; font-size: 13px;
    cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform .15s, opacity .15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary {
    background: linear-gradient(135deg, var(--copper), #b84b1f);
    color: #ffffff;
  }
  .btn-outline {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(194,155,97,.4);
    color: var(--gold-bright);
  }

  @media print {
    body { background: #fff; padding: 0; }
    .actions { display: none; }
    .qr-card {
      box-shadow: none;
      border: 1px solid #ddd;
      color: #111;
      background: #fff;
      margin: 0 auto;
    }
    .brand-title span, .brand-by, .scan-prompt, .card-footer strong { color: #111 !important; }
    .tagline, .card-footer { color: #444 !important; }
    .url-pill { border-color: #999; color: #111 !important; background: #f4f4f4; }
  }
</style>
</head>
<body>

<div class="qr-card">
  <div class="brand-seal">NNC</div>
  <div class="brand-title">
    <span>NUTS</span>
    <em>N</em>
    <span>CUTS</span>
  </div>
  <div class="brand-by">by Pakeeza</div>

  <div class="tagline">Pure Pantry Staples · Freshly Packed</div>

  <div class="qr-frame">
    <img src="nutsncuts-qr-code.svg" alt="Nuts N Cuts Website QR Code">
  </div>

  <div class="scan-prompt">Scan to Order Online</div>
  <a class="url-pill" href="https://nutsncuts-pakeeza.netlify.app/" target="_blank">nutsncuts-pakeeza.netlify.app</a>

  <div class="card-footer">
    <strong>Twin Cities &amp; Nationwide Delivery</strong>
    Dry Fruits · Authentic Spices · Ajwa Dates · Pure Seeds<br>
    WhatsApp: +92 333 3415977
  </div>
</div>

<div class="actions">
  <button class="btn btn-primary" onclick="window.print()">🖨️ Print / Save as PDF</button>
  <a class="btn btn-outline" href="nutsncuts-qr-code.png" download="nutsncuts-qr-code.png">⬇️ Download PNG</a>
  <a class="btn btn-outline" href="nutsncuts-qr-code.svg" download="nutsncuts-qr-code.svg">⬇️ Download SVG</a>
</div>

</body>
</html>
